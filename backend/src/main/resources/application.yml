spring:
  application:
    name: andestrack-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/andestrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:andestrack}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET_BASE64:}
    issuer: andestrack-api
    ttl-minutes: 30
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5500}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@andeslink.pe}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
    password: ${APP_DEMO_DATA_PASSWORD:}
logging:
  level:
    pe.andeslink.andestrack: INFO
